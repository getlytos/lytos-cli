# CI pipeline — runs on every push and pull request.
#
# Steps: install deps → format → lint → typecheck → secrets → build → test → verify binary.
# Build runs before test because tests execute the compiled binary.
#
# `format:check` and `secrets:scan` are gates in .lytos/quality/kit.md that ran
# nowhere for months (ISS-0132). A gate nothing executes is not a gate, and
# `format` proved it: src/ had never been formatted at all.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Configure git for tests
        run: |
          git config --global user.email "ci@lytos.org"
          git config --global user.name "Lytos CI"

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Secrets scan
        run: npm run secrets:scan

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify binary works
        run: |
          node dist/cli.js --version
          node dist/cli.js --help
          node dist/cli.js board --help
          node dist/cli.js init --help
